workflows:
  structia-android:
    name: StructIA - Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.structia.app"
    scripts:
      - name: Completar archivos nativos de Android (gradlew, etc.)
        script: |
          flutter create --platforms=android --org com.structia .
      - name: Configurar firma release
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          KEYEOF
          python3 - <<'PYEOF'
          import re, pathlib

          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              text = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + text
              block = (
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
                  'android {\n'
              )
              text = text.replace("android {", block, 1)
              text = text.replace(
                  "buildTypes {",
                  (
                      'signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                      '            storePassword = keystoreProperties["storePassword"] as String\n'
                      '        }\n'
                      '    }\n\n'
                      '    buildTypes {'
                  ),
                  1,
              )
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              header = (
                  'def keystoreProperties = new Properties()\n'
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              text = header + text
              text = text.replace(
                  "android {",
                  (
                      'android {\n'
                      '    signingConfigs {\n'
                      '        release {\n'
                      '            keyAlias keystoreProperties["keyAlias"]\n'
                      '            keyPassword keystoreProperties["keyPassword"]\n'
                      '            storeFile file(keystoreProperties["storeFile"])\n'
                      '            storePassword keystoreProperties["storePassword"]\n'
                      '        }\n'
                      '    }\n'
                  ),
                  1,
              )
              text = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  text,
              )
              groovy.write_text(text)
          PYEOF
      - name: Obtener dependencias
        script: |
          flutter pub get
      - name: Compilar APK (release, firmado)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
