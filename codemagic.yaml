workflows:
  structia-android:
    name: StructIA - Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - grupocastillo_keystore
      vars:
        PACKAGE_NAME: "com.structia.app"
    scripts:
      - name: Completar archivos nativos de Android (gradlew, etc.)
        script: |
          flutter create --platforms=android --org com.structia .
      - name: Configurar firma de release con el keystore
        script: |
          if [ -f "android/app/build.gradle.kts" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          else
            GRADLE_FILE="android/app/build.gradle"
          fi
          echo "Usando archivo: $GRADLE_FILE"

          cat > /tmp/fix_signing.py << 'PYEOF'
import sys

path = sys.argv[1]
with open(path) as f:
    content = f.read()

is_kts = path.endswith(".kts")

if "CM_KEYSTORE_PATH" in content:
    print("Ya configurado, no se modifica.")
else:
    if is_kts:
        signing_block = """
    signingConfigs {
        create("release") {
            storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
            storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias = System.getenv("CM_KEY_ALIAS")
            keyPassword = System.getenv("CM_KEY_PASSWORD")
        }
    }
"""
        content = content.replace("android {", "android {" + signing_block, 1)
        content = content.replace(
            'signingConfig = signingConfigs.getByName("debug")',
            'signingConfig = signingConfigs.getByName("release")',
        )
    else:
        signing_block = """
    signingConfigs {
        release {
            storeFile file(System.getenv("CM_KEYSTORE_PATH"))
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
        }
    }
"""
        content = content.replace("android {", "android {" + signing_block, 1)
        content = content.replace(
            "signingConfig signingConfigs.debug",
            "signingConfig signingConfigs.release",
        )

    with open(path, "w") as f:
        f.write(content)
    print("Firma configurada correctamente.")
PYEOF

          python3 /tmp/fix_signing.py "$GRADLE_FILE"
      - name: Obtener dependencias
        script: |
          flutter pub get
      - name: Compilar APK (release, firmado con keystore propio)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
